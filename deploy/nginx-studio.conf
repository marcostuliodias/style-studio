# nginx site for the Studio behind the host's nginx: copy to /etc/nginx/sites-available/studio, link it in
# sites-enabled, `nginx -t && systemctl reload nginx`, then `certbot --nginx -d studio.marcostulio.com` adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name studio.marcostulio.com;

    client_max_body_size 450m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
