# Fly.io: `fly launch --no-deploy` once (it reads this file), then `fly volumes create uploads --size 10`,
# `fly deploy`. Renders live in the machine's disk and are swept; uploads live on the volume.
app = "style-studio"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  STUDIO_HOST = "0.0.0.0"
  STUDIO_MAX_RENDERS = "1"
  STUDIO_MAX_QUEUE = "6"
  STUDIO_RENDER_TIMEOUT_MS = "600000"
  STUDIO_MAX_UPLOAD_MB = "400"
  STUDIO_MAX_FOOTAGE_SECONDS = "600"
  STUDIO_UPLOADS = "1"
  STUDIO_KEEP_HOURS = "6"

[http_service]
  internal_port = 3490
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "uploads"
  destination = "/app/public/footage/uploads"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
